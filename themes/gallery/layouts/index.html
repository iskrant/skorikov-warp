{{ define "main" }}
<div class="gallery-container">
    {{ $images := resources.Match "images/*.{jpg,jpeg,png,gif,webp,JPG,JPEG,PNG,GIF,WEBP}" }}
    {{ if $images }}
        {{ range $index, $image := $images }}
            {{ $thumb := $image.Resize "300x q85" }}
            <a class="gallery-item" href="{{ $image.RelPermalink }}" data-index="{{ $index }}" data-full="{{ $image.RelPermalink }}" data-title="{{ $image.Name }}">
                <img src="{{ $thumb.RelPermalink }}" alt="{{ i18n "painting_alt" }} {{ add $index 1 }}" width="{{ $thumb.Width }}" height="{{ $thumb.Height }}" loading="lazy">
            </a>
        {{ end }}
    {{ else }}
        <div class="no-images">
            <p>{{ i18n "no_images" }} <code>assets/images/</code></p>
        </div>
    {{ end }}
</div>
{{ end }}
